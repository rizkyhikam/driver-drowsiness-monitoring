<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Monitoring System</title>
    <!-- Lucide Icons & Tailwind CSS -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f6f8;
            color: #1e293b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 lg:p-10">

    <!-- Header Section -->
    <header class="flex items-center justify-between mb-8 max-w-7xl w-full mx-auto">
        <div class="flex items-center gap-4">
            <!-- Logo Icon -->
            <div class="w-10 h-10 rounded-xl bg-emerald-500/15 flex items-center justify-center text-emerald-600">
                <i data-lucide="activity" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800">Driver Monitoring System</h1>
                <p class="text-sm font-medium text-slate-400">Real-Time Driver Analysis</p>
            </div>
        </div>

        <!-- Top Right Indicators -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-emerald-50 text-emerald-600 text-xs font-semibold px-3 py-1.5 rounded-full border border-emerald-200">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live
            </div>
            <div class="hidden sm:block text-xs font-semibold text-slate-400 border-l border-slate-200 pl-4">
                <span id="liveTimestamp">10 Nov 2026 • 10:18:27</span>
            </div>
            <div class="w-9 h-9 rounded-full bg-slate-200/80 border border-slate-300/60 flex items-center justify-center text-slate-600">
                <i data-lucide="user" class="w-5 h-5"></i>
            </div>
        </div>
    </header>

    <!-- Main Grid Content -->
    <main class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start flex-1">
        
        <!-- Left Column: Webcam Input (8 Cols) -->
        <section class="lg:col-span-7 xl:col-span-8 bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm">
            <div class="flex items-center justify-between mb-4 px-1">
                <div class="flex items-center gap-2.5 text-slate-700 font-semibold text-sm">
                    <i data-lucide="video" class="w-4 h-4 text-slate-500"></i>
                    <span>Webcam Input</span>
                </div>
                <div class="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 text-[11px] font-medium px-2.5 py-1 rounded-full border border-emerald-200">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live
                </div>
            </div>

            <!-- Video Container -->
            <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-slate-900 border border-slate-200 shadow-inner">
                <img src="{{ url_for('video_feed') }}" class="w-full h-full object-cover" alt="Webcam Feed">
            </div>
        </section>

        <!-- Right Column: Status & Telemetry (4 Cols) -->
        <section class="lg:col-span-5 xl:col-span-4 flex flex-col gap-6">
            
            <!-- Driver Condition Status Card -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm">
                <div class="flex items-center gap-2 text-slate-700 font-semibold text-sm mb-4">
                    <i data-lucide="shield-check" class="w-4 h-4 text-slate-500"></i>
                    <span>Driver Condition Status</span>
                </div>

                <!-- Status Indicator Box -->
                <div id="statusBox" class="rounded-xl p-5 bg-emerald-50 border border-emerald-100 flex items-center gap-4 transition-all duration-300">
                    <div id="statusIconBg" class="w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center flex-shrink-0 shadow-sm">
                        <i id="statusIcon" data-lucide="check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h2 id="statusTitle" class="text-xl font-bold text-emerald-600 tracking-wide">ALERT</h2>
                        <p id="statusDesc" class="text-xs text-slate-600 font-medium leading-relaxed mt-0.5">Pengemudi terdeteksi dalam keadaan fokus penuh.</p>
                    </div>
                </div>
            </div>

            <!-- Geometric Telemetry Card -->
            <div class="bg-white rounded-2xl p-6 border border-slate-200/80 shadow-sm">
                <div class="flex items-center gap-2 text-slate-700 font-semibold text-sm mb-4">
                    <i data-lucide="bar-chart-2" class="w-4 h-4 text-slate-500"></i>
                    <span>Geometric Telemetry</span>
                </div>

                <div class="divide-y divide-slate-100 text-sm">
                    <!-- EAR -->
                    <div class="py-3.5 flex items-center justify-between">
                        <div class="flex items-center gap-3 text-slate-600">
                            <i data-lucide="eye" class="w-4 h-4 text-slate-400"></i>
                            <span class="font-medium text-xs sm:text-sm">Eye Aspect Ratio (EAR)</span>
                        </div>
                        <span id="valEar" class="font-semibold font-mono text-slate-800 text-base">0.45</span>
                    </div>

                    <!-- MAR -->
                    <div class="py-3.5 flex items-center justify-between">
                        <div class="flex items-center gap-3 text-slate-600">
                            <i data-lucide="smile" class="w-4 h-4 text-slate-400"></i>
                            <span class="font-medium text-xs sm:text-sm">Mouth Aspect Ratio (MAR)</span>
                        </div>
                        <span id="valMar" class="font-semibold font-mono text-slate-800 text-base">0.03</span>
                    </div>

                    <!-- Pitch -->
                    <div class="py-3.5 flex items-center justify-between">
                        <div class="flex items-center gap-3 text-slate-600">
                            <i data-lucide="headphones" class="w-4 h-4 text-slate-400"></i>
                            <span class="font-medium text-xs sm:text-sm">Head Pitch Angle</span>
                        </div>
                        <span id="valPitch" class="font-semibold font-mono text-slate-800 text-base">7.2°</span>
                    </div>

                    <!-- Yaw -->
                    <div class="py-3.5 flex items-center justify-between">
                        <div class="flex items-center gap-3 text-slate-600">
                            <i data-lucide="user-check" class="w-4 h-4 text-slate-400"></i>
                            <span class="font-medium text-xs sm:text-sm">Head Yaw Angle</span>
                        </div>
                        <span id="valYaw" class="font-semibold font-mono text-slate-800 text-base">0.6°</span>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Real-time Script -->
    <script>
        lucide.createIcons();

        // Update Tanggal Waktu Realtime
        function updateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('liveTimestamp').innerText = `${dateStr} • ${timeStr}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Realtime Fetch Telemetry
        setInterval(() => {
            fetch('/get_telemetry')
                .then(res => res.json())
                .then(data => {
                    const box = document.getElementById('statusBox');
                    const title = document.getElementById('statusTitle');
                    const desc = document.getElementById('statusDesc');
                    const iconBg = document.getElementById('statusIconBg');
                    const icon = document.getElementById('statusIcon');

                    title.innerText = data.status;

                    if (data.status === 'ALERT') {
                        box.className = 'rounded-xl p-5 bg-emerald-50 border border-emerald-100 flex items-center gap-4 transition-all duration-300';
                        iconBg.className = 'w-12 h-12 rounded-full bg-emerald-500 text-white flex items-center justify-center flex-shrink-0 shadow-sm';
                        title.className = 'text-xl font-bold text-emerald-600 tracking-wide';
                        desc.innerText = 'Pengemudi terdeteksi dalam keadaan fokus penuh.';
                        icon.setAttribute('data-lucide', 'check');
                    } else if (data.status === 'DROWSY') {
                        box.className = 'rounded-xl p-5 bg-rose-50 border border-rose-200 flex items-center gap-4 transition-all duration-300 animate-pulse';
                        iconBg.className = 'w-12 h-12 rounded-full bg-rose-500 text-white flex items-center justify-center flex-shrink-0 shadow-sm';
                        title.className = 'text-xl font-bold text-rose-600 tracking-wide';
                        desc.innerText = 'PERINGATAN: Terdeteksi gejala kantuk / mata terpejam lama!';
                        icon.setAttribute('data-lucide', 'alert-triangle');
                    } else if (data.status === 'DISTRACTED') {
                        box.className = 'rounded-xl p-5 bg-amber-50 border border-amber-200 flex items-center gap-4 transition-all duration-300';
                        iconBg.className = 'w-12 h-12 rounded-full bg-amber-500 text-white flex items-center justify-center flex-shrink-0 shadow-sm';
                        title.className = 'text-xl font-bold text-amber-600 tracking-wide';
                        desc.innerText = 'PERINGATAN: Pengemudi terdistraksi (tidak menatap jalan)!';
                        icon.setAttribute('data-lucide', 'alert-circle');
                    }
                    
                    lucide.createIcons();

                    document.getElementById('valEar').innerText = data.ear.toFixed(2);
                    document.getElementById('valMar').innerText = data.mar.toFixed(2);
                    document.getElementById('valPitch').innerText = data.pitch.toFixed(1) + '°';
                    document.getElementById('valYaw').innerText = data.yaw.toFixed(1) + '°';
                })
                .catch(err => console.error(err));
        }, 300);
    </script>
</body>
</html>
